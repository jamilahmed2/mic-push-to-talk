name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore MicPushToTalk/MicPushToTalk.csproj
    
    - name: Build
      run: dotnet build MicPushToTalk/MicPushToTalk.csproj -c Release --no-restore
    
    - name: Publish self-contained
      run: |
        dotnet publish MicPushToTalk/MicPushToTalk.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishReadyToRun=true `
          -o ./publish/MicPushToTalk
    
    - name: Copy documentation
      run: |
        Copy-Item README.md ./publish/MicPushToTalk/
        Copy-Item INSTALLATION.md ./publish/MicPushToTalk/
        Copy-Item QUICK-START.md ./publish/MicPushToTalk/
        Copy-Item LICENSE.txt ./publish/MicPushToTalk/
    
    - name: Create ZIP archive
      run: |
        $version = "${{ github.ref_name }}"
        Compress-Archive -Path ./publish/MicPushToTalk/* -DestinationPath "./MicPushToTalk-$version-win-x64.zip"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MicPushToTalk-win-x64
        path: ./MicPushToTalk-*.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./MicPushToTalk-*.zip
        body: |
          ## 🎤 Mic Push-To-Talk ${{ github.ref_name }}
          
          ### 📦 Download
          - **MicPushToTalk-${{ github.ref_name }}-win-x64.zip** - Portable version (no installation required)
          
          ### ✨ What's New
          - 🔄 **Toggle Mode**: Press once to unmute, press again to mute (no more holding keys!)
          - 🎨 **Glassmorphism UI**: Modern, beautiful interface with smooth animations
          - 🐛 **Fixed**: Hotkey no longer types in text fields
          - 🐛 **Fixed**: No more blinking when holding key
          - ⚡ **Live Settings**: Changes apply immediately without restart
          - ✨ **Close Button**: Added to overlay (appears on hover)
          - 🎯 **Draggable Settings**: Settings window can now be moved
          
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.
          
          ### 🚀 Installation
          1. Download the ZIP file above
          2. Extract to any folder (e.g., `C:\Program Files\MicPushToTalk`)
          3. Run `MicPushToTalk.exe`
          4. **No .NET installation required!** (self-contained)
          
          ### 💻 System Requirements
          - **OS**: Windows 10 (1809+) or Windows 11
          - **Architecture**: 64-bit (x64)
          - **Disk Space**: ~200 MB
          - **RAM**: 50 MB minimum
          - **Permissions**: Microphone access
          
          ### 🎯 Quick Start
          1. Launch the application
          2. Default hotkey: **Left Alt**
          3. **Press once** to unmute (green icon) 🟢
          4. **Press again** to mute (red icon) 🔴
          5. Right-click tray icon for settings
          
          ### 🎨 Features
          - ✅ System-wide microphone toggle
          - ✅ Global hotkey support (any key or mouse button)
          - ✅ Always-on-top floating overlay
          - ✅ Glassmorphism design with smooth animations
          - ✅ Volume visualizer
          - ✅ Draggable overlay with edge snapping
          - ✅ Customizable size, opacity, and colors
          - ✅ System tray integration
          - ✅ Auto-start on boot option
          
          ### 📚 Documentation
          - [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) - Complete documentation
          - [QUICK-START.md](https://github.com/${{ github.repository }}/blob/main/QUICK-START.md) - Quick start guide
          - [INSTALLATION.md](https://github.com/${{ github.repository }}/blob/main/INSTALLATION.md) - Installation instructions
          
          ### 🐛 Known Issues
          - Some fullscreen games may block the overlay (use borderless windowed mode)
          - Certain anti-cheat systems may block keyboard hooks
          
          ### 💡 Tips
          - Try **Caps Lock** or **Mouse Button 4** as hotkey for gaming
          - Enable "Snap to edges" for easy positioning
          - Use volume visualizer to see mic input levels
          
          ---
          
          **Enjoy your new microphone control!** 🎤✨
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
